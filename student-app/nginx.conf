server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Try to find the exact file, then the folder, then fall back to index.html
        # This is what makes React Router work:
        # /students → nginx looks for a file called 'students' → not found
        # → falls back to index.html → React Router renders the /students component
        try_files $uri $uri/ /index.html;
    }
}